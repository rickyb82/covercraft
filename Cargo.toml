[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/rickyb82/covercraft"

[workspace.dependencies]
covercraft-core = { path = "crates/core", version = "0.1.0" }
covercraft-db = { path = "crates/db", version = "0.1.0" }
covercraft-engine = { path = "crates/engine", version = "0.1.0" }
covercraft-mcp = { path = "crates/mcp", version = "0.1.0" }
covercraft-remote = { path = "crates/remote", version = "0.1.0" }
covercraft-ui-egui = { path = "crates/ui-egui", version = "0.1.0" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
ehttp = "0.7"
web-time = "1"
mysql = { version = "26", default-features = false, features = ["minimal", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
flate2 = "1"

egui = "0.36"
eframe = { version = "0.36", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
